name: Performance packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win32
            arch: x64
            artifact: windows-x64
            build: npm run package:windows
            smoke: node scripts/smoke-windows-package.mjs dist
          - name: Mac Apple Silicon
            os: macos-26
            platform: darwin
            arch: arm64
            artifact: macos-arm64
            build: npm run package:mac -- --arch arm64
            smoke: node scripts/smoke-mac-package.mjs dist --arch arm64
          - name: Mac Intel
            os: macos-15-intel
            platform: darwin
            arch: x64
            artifact: macos-x64
            build: npm run package:mac -- --arch x64
            smoke: node scripts/smoke-mac-package.mjs dist --arch x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify native build architecture
        run: node -e "if(process.platform!=='${{ matrix.platform }}'||process.arch!=='${{ matrix.arch }}')throw new Error('Runner does not match the package architecture')"
      - run: npm ci
      - run: npm test
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw new Error('Version tag must match package.json')"
      - name: Build offline package
        run: ${{ matrix.build }}
      - name: Check bundled package natively
        run: ${{ matrix.smoke }}
      - uses: actions/upload-artifact@v4
        with:
          name: karhutla-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: karhutla-*
          merge-multiple: true
          path: dist
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 docs/mac-setup.pdf --verify-tag --title "karhutla $GITHUB_REF_NAME" --notes-file docs/release-notes.md
